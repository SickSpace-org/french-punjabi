name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_wsEgi1ihnMoYQYRRsrBU1uVk
      VERCEL_PROJECT_ID: prj_uOVVlIAppUUm902LQuK0t5E5Cvod
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      # Build on Vercel (not here) so Sensitive env vars resolve to real values.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
